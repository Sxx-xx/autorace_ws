# The first lane-driving test on the Pi camera (C920 unplugged), 2026-10-23: race.launch.py
# extra_params:=$(pwd)/tools/drive_test_picam.yaml lane_camera_topic:=/camera/image_raw
# lane_camera_info_topic:=/camera/camera_info sign_camera_topic:=/camera/image_raw missions:=none
# The camera geometry below is written by tools/picam_calibrate.py. Speed, steering and bend
# values tuned on this camera went into perception_real.yaml (2026-10-25).
lane_controller:
  ros__parameters:
    # real-lane-pi's controller (2a5c64b, lane following on the Pi with the C920), tried on the
    # Pi camera 2026-10-25. Delete this section to go back to perception_real.yaml's tuning.
    # Its look-ahead (0.37..0.55 m) is out of the Pi camera's view (0.13..0.39 m): not taken.
    max_speed: 0.20           # real-lane-pi 0.22; the mux holds each wheel to 0.20 anyway
    curve_speed: 0.12         # two-speed mode: slow down in bends
    curve_enter_curvature: 0.8
    curve_exit_curvature: 0.5
    curve_exit_delay: 0.3
    curve_source: lane        # detect_lane's bend/straight: the steering curvature never let it speed up again
    pursuit_gain: 1.0
    cornering_rate: 0.825
    min_speed: 0.05
    recovery_speed: 0.05
    recovery_angular: 0.45
    single_line_slew: 0.5
    # 2026-10-27, after the corner videos (deep into the corner, on the spot, out on the outer
    # line): corner_boost 0.3 and yaw_rate_feedback on again (perception_real.yaml's; they
    # were off here as in real-lane-pi), slow down before the bend, steer harder out of it.
    # Closed loop TURN_SHARE=0.75 BEND_R=0.30: outside 2.5 -> 0 cm, after the bend 3.3 -> 1.6 cm
    # (pre_slow alone did not help in the closed loop, which has no braking lag; try it here).
    pre_slow_full: 0.22       # rad: curve_speed by then (detect_lane calls the bend at 0.25)
    exit_boost: 0.3
mission_manager:
  ros__parameters:
    standby_timeout: 100000.0 # start only on /autorace/manual_start (90 s would start on its own)
bev_projector:
  ros__parameters:
    # Calibrated on one picture of the straight lane, 2026-10-23 (tools/picam_calibrate.py and a search
    # for the pitch that lays the two lines parallel in the bird's eye view, fov 62 deg as camera_info):
    # pitch 47.6 deg, height from the lines' 0.33 m spacing 0.180 m. Only ~7 cm of the yellow line was
    # in view, so +-2 deg is likely; check on the overlay while driving.
    camera:
      height: 0.180
      pitch: 0.831
      forward_offset: 0.045
    bev:
      near: 0.13            # the bottom image row reaches ~0.125 m ahead of the axle
detect_lane:
  ros__parameters:
    bev:
      near: 0.13
    detect:
      lane:
        # Measured in this room (2026-10-23): yellow tape H 26-28 S 152, the wooden floor beside
        # the course H 15-17 S 117, which perception_real.yaml's hue 10-127 took for yellow.
        yellow:
          hue_l: 21
          hue_h: 40
          saturation_l: 100
