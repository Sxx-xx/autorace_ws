---
# Perception tuning for the simulated AutoRace course.
#
# The bird's eye view is defined in metres: the projector is told where the
# camera sits and how far ahead to look, and everything downstream works from
# `pixels_per_meter`.  At 1200 px/m the 800x300 output covers +/-0.333 m
# across and 0.07..0.32 m ahead of the wheel axle. Distances are all from the
# axle, not the camera.
#
# The lane camera is the downward looking one (/camera_lane), not the forward
# camera the sign detectors use.
bev_projector:
  ros__parameters:
    camera:
      height: 0.22          # above the road surface
      pitch: 1.05           # rad, nose down: almost straight down, with the front
                            # of the robot just in the bottom of the picture
      forward_offset: 0.030
    bev:
      pixels_per_meter: 1200.0
      width: 800
      height: 300
      near: 0.07            # nearer than this the camera sees the robot itself
    blur_kernel: 5

detect_lane:
  ros__parameters:
    bev:
      pixels_per_meter: 1200.0
      near: 0.07
    lane:
      width_m: 0.25         # measured between the line centres on the course
      # Further out, the robot starts turning before it reaches the bend and
      # cuts the corner; with 2 cm to spare either side there is no room to.
      control_lookahead: 0.16
    detect:
      min_pixels: 2000
      max_line_width_m: 0.08
      auto_threshold: true
      lane:
        white:
          hue_l: 0
          hue_h: 179
          saturation_l: 0
          saturation_h: 70
          lightness_l: 105
          lightness_h: 255
        yellow:
          hue_l: 10
          hue_h: 127
          saturation_l: 70
          saturation_h: 255
          lightness_l: 95
          lightness_h: 255
    reliability:
      step: 5
    process_every_n: 2
    hold_last_center_sec: 0.4

detect_stop_line:
  ros__parameters:
    bev:
      pixels_per_meter: 1200.0
      near: 0.07

lane_controller:
  ros__parameters:
    max_speed: 0.22
    min_speed: 0.05
    pursuit_gain: 1.0
    max_angular: 2.0
    cornering_rate: 0.825
    lane_timeout: 0.5
    recovery_speed: 0.05
    recovery_angular: 0.45
    recovery_timeout: 8.0
