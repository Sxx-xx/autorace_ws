---
# Perception tuning for the real TurtleBot3 Burger.
#
# Copied from perception_sim.yaml. The course geometry (lane width, BEV scale)
# is the same as the sim, which was built from the venue's map. What differs
# on the robot is marked "MEASURE" (geometry of the real camera mount) or
# "TUNE" (anything that depends on the real camera and lighting).
#
# The lane camera is the downward looking one (/camera_lane), not the forward
# camera the sign detectors use. Mount it as in the sim: 0.22 m above the
# floor, 0.030 m ahead of the wheel axle, nose down 1.05 rad (60 deg). If the
# mount differs, measure it and change camera.* below; everything else in the
# lane pipeline derives from camera_info and these three numbers.
bev_projector:
  ros__parameters:
    camera:
      height: 0.155         # C920, measured 15.5 cm (hun, real-lane-pi 2026-10-08)
      pitch: 0.128          # 7.3 deg down, from the lane lines' vanishing point (hun)
      forward_offset: 0.060 # measured: lens 6 cm ahead of the wheel axle (hun)
    bev:
      pixels_per_meter: 1200.0
      width: 800
      height: 300
      near: 0.35            # the bottom image row reaches the floor ~0.34 m ahead
    blur_kernel: 5

detect_lane:
  ros__parameters:
    bev:
      pixels_per_meter: 1200.0
      near: 0.35
    lane:
      width_m: 0.33         # practice track, centre to centre (hun's camera check 0.335).
                            # 0.25 earlier was assumed, and the Pi camera height derived from it.
      control_lookahead: 0.40  # inside the BEV (0.35..0.60 m with the C920 at 15.5 cm, 7.3 deg)
      max_target_angle: 0.7
    detect:
      # The C920 at 11 cm sees only a short stretch of each line (both lines
      # from 0.24 m): a line is a few thousand pixels at best. Measured on the
      # practice course 2026-10-08: floor L 131 (95th 144), white tape L 199,
      # yellow tape L 145 / S 99.
      min_pixels: 800
      max_line_width_m: 0.08
      # TUNE: auto_threshold adapts the white threshold to the picture; keep
      # it on. The HSV bounds below are the sim's; check them with
      # /detect/image_lane on the real floor (black Formex is glossy).
      auto_threshold: true
      auto_threshold_low: 1000
      auto_threshold_min_lightness: 160   # never down into the floor
      lane:
        white:
          hue_l: 0
          hue_h: 179
          saturation_l: 0
          saturation_h: 70
          lightness_l: 170
          lightness_h: 255
        yellow:
          hue_l: 10
          hue_h: 127
          saturation_l: 70
          saturation_h: 255
          lightness_l: 95
          lightness_h: 255
    reliability:
      step: 5
    # The sim camera ran at 30 fps; over Wi-Fi the real one may not. Process
    # every frame and let the PC do the work.
    process_every_n: 1
    hold_last_center_sec: 0.4

detect_stop_line:
  ros__parameters:
    bev:
      pixels_per_meter: 1200.0
      near: 0.35
    red:
      hue_margin: 10      # TUNE
      saturation_l: 120
      value_l: 80
    min_width_m: 0.10

lane_controller:
  ros__parameters:
    # Straight on at full speed, and at a bend stop and turn on the spot
    # until the lane is straight ahead again (2026-10-08).
    turn_in_place: false     # tried 2026-10-08: back to steering through bends, slower
    turn_enter_angle: 0.35    # 20 deg
    turn_exit_angle: 0.09     # 5 deg
    turn_rate: 0.25
    # The motors do 0.211 m/s unloaded and less under load; 0.18 leaves the
    # outer wheel room to turn at speed. Raise towards 0.20 once the lane
    # following is clean on the real floor.
    max_speed: 0.18
    min_speed: 0.05
    # The run starts on the stop line: no creeping up to it before the green.
    standby_speed: 0.0
    pursuit_gain: 1.0
    max_angular: 2.0
    cornering_rate: 0.5      # bends slower: 0.07 m/s at the 0.15 m radius of the practice bend
    lane_timeout: 0.5
    recovery_speed: 0.05
    recovery_angular: 0.45
    recovery_timeout: 8.0

cmd_vel_mux:
  ros__parameters:
    input_timeout: 0.3
    publish_rate: 50.0
    stall_timeout: 20.0
    creep_timeout: 25.0
    creep_speed: 0.05
    # Wedged-robot detection from the laser. TUNE on the real LDS: stand the
    # robot still, run tools/check_robot.sh and read the scan noise; the
    # threshold must be well clear of it. The sim's noise was 1 cm.
    blocked_timeout: 3.0
    unstick_duration: 1.5
    unstick_speed: -0.07
    scan_change_threshold: 0.05
    scan_moved_share: 0.05
    # Burger: motors 0.211 m/s unloaded, wheels 0.160 m apart.
    wheel_speed: 0.20
    wheel_separation: 0.160
